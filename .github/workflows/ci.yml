name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Validate: lint + build. This is the single gate for every deployment.
  # No deployment job in this repository runs unless this job succeeds.
  # ---------------------------------------------------------------------
  validate:
    name: Validate (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Restore Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-install-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-install-

      - name: Install dependencies
        run: bun install --frozen-lockfile
        timeout-minutes: 15

      - name: Run regression tests
        run: bun run test
        timeout-minutes: 5
        env:
          APP_DATABASE_URL: postgresql://test_app:test@127.0.0.1:1/test
          DATABASE_URL: postgresql://test_owner:test@127.0.0.1:1/test
          JWT_SECRET: goatmaster-ci-test-only-not-for-production-12345

      - name: Check types
        run: bun run typecheck
        timeout-minutes: 10
        env:
          APP_DATABASE_URL: postgresql://test_app:test@127.0.0.1:1/test
          JWT_SECRET: goatmaster-ci-test-only-not-for-production-12345

      - name: Run ESLint
        run: bun run lint
        timeout-minutes: 15

- name: Build
        run: bun run build
        timeout-minutes: 20
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          JWT_SECRET: goatmaster-ci-test-only-not-for-production-12345
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          PAYSTACK_WEBHOOK_SECRET: ${{ secrets.PAYSTACK_WEBHOOK_SECRET }}
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}
          APP_DATABASE_URL: ${{ secrets.APP_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ML_SERVICE_KEY: ${{ secrets.ML_SERVICE_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  # ---------------------------------------------------------------------
  # Deploy preview — the ONLY path to a Vercel preview deployment.
  # Gated on `needs.validate.result == 'success'` so a preview can only
  # ever be produced from a run whose lint and build both passed.
  # ---------------------------------------------------------------------
  deploy-preview:
    name: Deploy preview
    needs: validate
    if: needs.validate.result == 'success' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: Preview
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify Vercel credentials are present
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is missing. The deploy was blocked, not attempted."
            exit 1
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Restore Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-install-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        timeout-minutes: 15

      - name: Deploy to Vercel (preview)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set +e
          npx --yes vercel@64.3.1 deploy \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_ORG_ID" \
            --project "$VERCEL_PROJECT_ID" \
            --target preview \
            --yes \
            --meta githubCommitSha="$GITHUB_SHA" \
            --meta githubCommitRef="$GITHUB_REF_NAME" \
            --meta githubRepo=goatmaster \
            --meta githubOrg=pekay23 \
            --json > deployment.json
          CLI_EXIT=$?
          set -e

          if [ ! -s deployment.json ]; then
            echo "::error::The Vercel CLI produced no output (exit code $CLI_EXIT)."
            exit 1
          fi

          DEPLOY_ID=$(node -e "try{const d=JSON.parse(require('fs').readFileSync('deployment.json','utf8'));process.stdout.write(d.id||d.uid||((d.deployment||{}).id)||((d.deployment||{}).uid)||'')}catch(e){process.stdout.write('')}")
          URL=$(node -e "try{const d=JSON.parse(require('fs').readFileSync('deployment.json','utf8'));process.stdout.write(d.url||((d.deployment||{}).url)||'')}catch(e){process.stdout.write('')}")

          if [ -z "$DEPLOY_ID" ]; then
            echo "::error::Could not read the deployment id from the Vercel CLI output (exit code $CLI_EXIT):"
            cat deployment.json
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployment id: $DEPLOY_ID"

          for i in $(seq 1 60); do
            STATE=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$DEPLOY_ID" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);process.stdout.write(j.readyState||j.state||'')}catch(e){process.stdout.write('')}})")
            case "$STATE" in
              READY|ERROR|CANCELED)
                echo "Deployment $DEPLOY_ID finished with state $STATE"
                if [ "$STATE" != "READY" ]; then
                  echo "::error::Vercel deployment failed with state $STATE"
                  exit 1
                fi
                echo "Deployed preview: $URL"
                exit 0
                ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for deployment $DEPLOY_ID to finish"
          exit 1

  # ---------------------------------------------------------------------
  # Deploy production — the ONLY path to a Vercel production deployment.
  # Gated on `needs.validate.result == 'success'` and restricted to pushes
  # to main, so production can only ever be deployed from a fully-validated
  # main branch via CI.
  # ---------------------------------------------------------------------
  deploy-production:
    name: Deploy production
    needs: validate
    if: needs.validate.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: Production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify Vercel credentials are present
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is missing. The deploy was blocked, not attempted."
            exit 1
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Restore Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-install-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        timeout-minutes: 15

      - name: Deploy to Vercel (production)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set +e
          npx --yes vercel@64.3.1 deploy \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_ORG_ID" \
            --project "$VERCEL_PROJECT_ID" \
            --target production \
            --yes \
            --meta githubCommitSha="$GITHUB_SHA" \
            --meta githubCommitRef="$GITHUB_REF_NAME" \
            --meta githubRepo=goatmaster \
            --meta githubOrg=pekay23 \
            --json > deployment.json
          CLI_EXIT=$?
          set -e

          if [ ! -s deployment.json ]; then
            echo "::error::The Vercel CLI produced no output (exit code $CLI_EXIT)."
            exit 1
          fi

          DEPLOY_ID=$(node -e "try{const d=JSON.parse(require('fs').readFileSync('deployment.json','utf8'));process.stdout.write(d.id||d.uid||((d.deployment||{}).id)||((d.deployment||{}).uid)||'')}catch(e){process.stdout.write('')}")
          URL=$(node -e "try{const d=JSON.parse(require('fs').readFileSync('deployment.json','utf8'));process.stdout.write(d.url||((d.deployment||{}).url)||'')}catch(e){process.stdout.write('')}")

          if [ -z "$DEPLOY_ID" ]; then
            echo "::error::Could not read the deployment id from the Vercel CLI output (exit code $CLI_EXIT):"
            cat deployment.json
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployment id: $DEPLOY_ID"

          for i in $(seq 1 60); do
            STATE=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$DEPLOY_ID" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);process.stdout.write(j.readyState||j.state||'')}catch(e){process.stdout.write('')}})")
            case "$STATE" in
              READY|ERROR|CANCELED)
                echo "Deployment $DEPLOY_ID finished with state $STATE"
                if [ "$STATE" != "READY" ]; then
                  echo "::error::Vercel deployment failed with state $STATE"
                  exit 1
                fi
                echo "Deployed production: $URL"
                exit 0
                ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for deployment $DEPLOY_ID to finish"
          exit 1
